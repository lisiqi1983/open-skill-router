name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Smoke tests
        run: |
          pnpm test:smoke
          pnpm test:mcp
          pnpm test:static
          pnpm test:api
          pnpm test:catalog
          pnpm test:multidim
          pnpm test:scoring
          pnpm test:analysis

      - name: Build release bundle
        run: pnpm release:bundle

      - name: Verify release bundle
        run: node scripts/smoke-m6-release-bundle.mjs

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            "dist/release/open-skill-router-static-index.tar.gz"
            "dist/release/release-manifest.json"
            "dist/release/checksums.sha256"
            "dist/release/public/open-skill-router/index/index.json"
            "dist/release/public/open-skill-router/index/skills.jsonl"
            "dist/release/public/open-skill-router/index/skills.jsonl.sha256"
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --target "$GITHUB_SHA" --generate-notes
          fi
