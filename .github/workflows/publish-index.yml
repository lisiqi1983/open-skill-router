name: Publish Static Skill Index

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches:
      - main
    paths:
      - "skillrouter.source.yaml"
      - "skillrouter.public-seed.yaml"
      - "examples/**"
      - "skills/**"
      - "apps/indexer/**"
      - "packages/core/**"
      - ".github/workflows/publish-index.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Build static index
        run: node apps/cli/dist/index.js index-source skillrouter.source.yaml --out public/open-skill-router/index
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build public seed static index
        run: node apps/cli/dist/index.js index-source skillrouter.public-seed.yaml --out public/open-skill-router/public-seed/index
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
