name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: CLI smoke
        run: pnpm test:smoke

      - name: MCP smoke
        run: pnpm test:mcp

      - name: Static source smoke
        run: pnpm test:static

      - name: API smoke
        run: pnpm test:api

      - name: Release bundle smoke
        run: pnpm test:release

      - name: Catalog smoke
        run: pnpm test:catalog
